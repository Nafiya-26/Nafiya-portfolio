<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — DyslexEase</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page auth-bg-signup">
    <div class="auth-shapes">
      <div class="auth-shape as-1"></div>
      <div class="auth-shape as-2"></div>
      <div class="auth-shape as-3"></div>
    </div>
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">📖</span>
        <span class="logo-text">DyslexEase</span>
        <p>Create your free account</p>
      </div>

      <h2>Join Us! 🎉</h2>
      <p class="auth-subtitle">Start your dyslexia-friendly reading journey today</p>

      <div class="social-btns">
        <button class="btn-social" onclick="showToast('🔄 Google signup coming soon!')">
          <span>🅖</span> Google
        </button>
        <button class="btn-social" onclick="showToast('🔄 GitHub signup coming soon!')">
          <span>⬛</span> GitHub
        </button>
      </div>
      <div class="auth-divider">or create with email</div>

      <form onsubmit="handleSignup(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="signupName">👤 Full Name</label>
            <div class="input-icon">
              <input type="text" id="signupName" placeholder="Your full name" required autocomplete="name">
            </div>
          </div>
          <div class="form-group">
            <label for="signupAge">🎂 Age</label>
            <input type="number" id="signupAge" placeholder="Your age" min="5" max="100">
          </div>
        </div>

        <div class="form-group">
          <label for="signupEmail">📧 Email Address</label>
          <div class="input-icon">
            <input type="email" id="signupEmail" placeholder="your@email.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="signupRole">👨‍🎓 I am a...</label>
          <select id="signupRole">
            <option value="">Select your role</option>
            <option value="student">Student</option>
            <option value="teacher">Teacher / Educator</option>
            <option value="parent">Parent / Guardian</option>
            <option value="adult">Adult Learner</option>
            <option value="therapist">Therapist / Specialist</option>
          </select>
        </div>

        <div class="form-group">
          <label for="signupPass">🔒 Password</label>
          <div class="input-icon">
            <input type="password" id="signupPass" placeholder="Create a strong password" required
              oninput="checkPasswordStrength(this.value)" autocomplete="new-password">
          </div>
          <div class="password-strength">
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <span class="strength-text" id="strengthText"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="signupConfirm">🔒 Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="Re-enter your password" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="terms" required>
            <label for="terms">
              I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </label>
          </div>
        </div>

        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="dyslexia-user">
            <label for="dyslexia-user">
              I have dyslexia or a reading challenge (optional, helps us personalize your experience)
            </label>
          </div>
        </div>

        <button type="submit" class="btn-auth">🚀 Create My Free Account</button>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Login here →</a>
      </div>
      <div class="auth-switch" style="margin-top: 8px;">
        <a href="../index.html">← Back to Home</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
